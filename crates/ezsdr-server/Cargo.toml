[package]
name = "ezsdr-server"
version = "0.3.0"
description = "Ez-SDR v4 server: runs one Session for a client over the protocol ezsdr.protocol 2 (design/16-easy-api.md)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ezsdr-server"
path = "src/main.rs"

[dependencies]
ezsdr-kernel = { path = "../ezsdr-kernel" }
ezsdr-radio = { path = "../ezsdr-radio" }
ezsdr-sim = { path = "../ezsdr-sim" }
ezsdr-sink = { path = "../ezsdr-sink" }
ezsdr-sim-engine = { path = "../ezsdr-sim-engine" }
ezsdr-mock-radio = { path = "../ezsdr-mock-radio" }
ezsdr-link-host = { path = "../ezsdr-link-host" }
ezsdr-sink-capture = { path = "../ezsdr-sink-capture" }
ezsdr-exec-native = { path = "../ezsdr-exec-native" }
ezsdr-radio-uhd = { path = "../ezsdr-radio-uhd" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"

[features]
# Links libuhd: the catalogue opens real USRPs (VE-5; spec 18 UR-2).
uhd = ["ezsdr-radio-uhd/uhd"]

[dev-dependencies]
ezsdr-kernel = { path = "../ezsdr-kernel", features = ["testing"] }
